# ==============================================================================
# SonarQube Project Configuration
# Antigravity JS Curriculum & Engine
# ==============================================================================

# Required Metadata
sonar.projectKey=antigravity-js
sonar.projectName=Antigravity JS (Linear UI)
sonar.projectVersion=1.0.0

# Server Connection
sonar.host.url=http://localhost:9000
# Token is NOT stored here. Provide it via the environment: SONAR_TOKEN=... npm run sonar

# Source Code Paths
sonar.sources=frontend/src,backend/src
sonar.tests=

# Encoding & Language
sonar.sourceEncoding=UTF-8

# Exclusions (Avoid scanning builds, dependencies, raw databases and scripts)
sonar.exclusions=**/node_modules/**,**/dist/**,database/**,coverage/**,**/scripts/**,**/*.sqlite,**/*.sqlite-*

# JavaScript / CSS Specific Rules
sonar.javascript.environments=browser,node
sonar.css.file.suffixes=.css
